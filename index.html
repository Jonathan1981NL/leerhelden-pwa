  <style>

*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,ui-rounded,"Segoe UI",system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 12% -10%,#244d9d 0,transparent 34rem),radial-gradient(circle at 100% 8%,rgba(141,108,255,.25),transparent 30rem),linear-gradient(155deg,var(--bg),#0a1f46 58%,#07152f);overflow-x:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid rgba(101,244,255,.45);outline-offset:2px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(32px,5vw,58px);line-height:.98;letter-spacing:-1.6px}h2{font-size:clamp(24px,3vw,36px)}h3{font-size:20px}p{line-height:1.55}.muted{color:var(--muted)}.eyebrow{display:block;color:var(--cyan);font-size:12px;text-transform:uppercase;letter-spacing:1.4px;font-weight:950;margin-bottom:7px}.app{min-height:100vh;padding-bottom:90px}.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:max(10px,env(safe-area-inset-top)) 18px 10px;background:rgba(5,16,38,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-weight:950}.brand-mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--cyan),var(--violet) 55%,var(--gold));color:#07152f;box-shadow:0 10px 30px rgba(101,244,255,.2);font-size:22px}.toolbar{display:flex;gap:8px;align-items:center}.icon-btn,.btn,.nav-btn,.profile-card,.answer,.game-card,.market-card,.world-cell,.memory-card,.connect-cell,.reaction-pad{border:0;color:inherit}.icon-btn{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.09);font-size:20px}.container{width:min(1220px,calc(100% - 28px));margin:0 auto;padding:22px 0 46px}.card{border:1px solid var(--line);background:linear-gradient(145deg,rgba(20 /* Profiles and avatars */
.profile-screen{min-height:100vh;display:grid;place-items:center;padding:24px}.profile-wrap{width:min(1150px,100%);text-align:center}.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:25px}.profile-card{position:relative;overflow:hidden;text-align:left;border-radius:28px;background:linear-gradient(155deg,rgba(27,62,130,.96),rgba(9,26,61,.98));border:1px solid var(--line);box-shadow:var(--shadow);transition:.22s;padding:0}.profile-card:hover{transform:translateY(-7px) scale(1.01)}.profile-card.add{min-height:360px;display:grid;place-items:center;text-align:center;padding:26px;border:2px dashed rgba(255,255,255,.22)}.profile-hero{height:205px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 35%,rgba(101,244,255,.45),transparent 34%),linear-gradient(145deg,#244eaa,#692bb9)}.profile-card[data-gender="female"] .profile-hero{background:radial-gradient(circle at 50% 35%,rgba(255,120,200,.5),transparent 34%),linear-gradient(145deg,#6937a9,#b52f79)}.profile-info{padding:18px 20px 22px}.profile-info p{color:var(--muted)}.anime-avatar{position:absolute;width:142px;height:172px;left:50%;bottom:-3px;transform:translateX(-50%);filter:drop-shadow(0 14px 10px rgba(0,0,0,.35))}.avatar-head{position:absolute;left:40px;top:38px;width:64px;height:70px;border-radius:48% 48% 44% 44%;background:linear-gradient(145deg,#ffd4af,#e99b70);border:3px solid #17213f;z-index:4}.avatar-eye{position:absolute;top:31px;width:12px;height:7px;border-radius:50%;background:#fff;border:2px solid #17213f}.avatar-eye:after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:#17213f;left:3px;top:0}.avatar-eye.l{left:10px}.avatar-eye.r{right:10px}.avatar-mouth{position:absolute;left:25px;bottom:10px;width:17px;height:6px;border-bottom:3px solid #8b3d3f;border-radius:50%}.avatar-hair{position:absolute;left:20px;top:0;width:104px;height:88px;z-index:5}.avatar-hair i{position:absolute;bottom:0;left:43px;width:26px;height:78px;background:var(--hair,#ffd942);clip-path:polygon(50% 0,100% 100%,0 100%);transform-origin:bottom}.avatar-hair i:nth-child(1){transform:rotate(-48deg) translate(-31px,-3px)}.avatar-hair i:nth-child(2){transform:rotate(-27deg) translate(-16px,-12px)}.avatar-hair i:nth-child(3){transform:rotate(-8deg) translate(-2px,-18px)}.avatar-hair i:nth-child(4){transform:rotate(12deg) translate(6px,-16px)}.avatar-hair i:nth-child(5){transform:rotate(32deg) translate(17px,-10px)}.avatar-hair i:nth-child(6){transform:rotate(52deg) translate(30px,-2px)}.anime-avatar.female .avatar-hair:after{content:"";position:absolute;left:14px;top:41px;width:84px;height:92px;border-radius:45% 45% 50% 50%;background:var(--hair,#d96cff);z-index:-1;border:3px solid #17213f}.avatar-body{position:absolute;left:25px;bottom:0;width:94px;height:88px;border-radius:48% 48% 18% 18%;background:linear-gradient(145deg,var(--outfit,#2478ff),#111d56);border:4px solid #17213f;z-index:2}.anime-avatar.female .avatar-body{border-radius:46% 46% 34% 34%;background:linear-gradient(145deg,var(--outfit,#ff78c8),#672361)}.avatar-body:after{content:"";position:absolute;left:38px;top:0;width:10px;height:82px;background:rgba(255,255,255,.15)}.avatar-arm{position:absolute;bottom:21px;width:28px;height:78px;border-radius:18px;background:linear-gradient(#ffd4af,#e99b70);border:3px solid #17213f;z-index:1}.avatar-arm.l{left:13px;transform:rotate(15deg)}.avatar-arm.r{right:13px;transform:rotate(-15deg)}.avatar-aura{position:absolute;inset:16px 13px 0;border-radius:50%;border:3px solid rgba(101,244,255,.7);box-shadow:0 0 18px var(--aura,#65f4ff),inset 0 0 18px var(--aura,#65f4ff);animation:auraPulse 1.4s ease-in-out infinite;z-index:0}.avatar-spark{position:absolute;width:7px;height:24px;background:#fff;clip-path:polygon(50% 0,100% 35%,60% 45%,100% 100%,0 55%,40% 44%,0 20%);animation:spark 1.6s linear infinite}.avatar-spark.s1{left:12px;top:65px}.avatar-spark.s2{right:7px;top:30px;animation-delay:.5s}.avatar-spark.s3{right:17px;botto /* Hero scene */
.hero-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:18px}.hero-copy{min-height:330px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.hero-copy:after{content:"";position:absolute;width:270px;height:270px;border-radius:50%;right:-80px;bottom:-90px;background:radial-gradient(circle,rgba(255,207,74,.28),transparent 68%)}.scene{position:relative;min-height:330px;overflow:hidden;padding:0;background:linear-gradient(#4ab9ff 0 47%,#74c47a 47% 100%);perspective:900px}.scene.sky-night{background:linear-gradient(#172563 0 47%,#34566f 47% 100%)}.scene .sun{position:absolute;right:38px;top:30px;width:72px;height:72px;border-radius:50%;background:#fff69d;box-shadow:0 0 42px #ffe75d;animation:sunPulse 3s ease-in-out infinite}.scene .mountains{position:absolute;left:-3%;right:-3%;bottom:45%;height:120px;background:linear-gradient(135deg,transparent 0 15%,#5f78a8 16% 31%,transparent 32% 36%,#7791bb 37% 55%,transparent 56% 63%,#49688e 64% 80%,transparent 81%);opacity:.88}.scene .river{position:absolute;left:45%;bottom:-30px;width:155px;height:225px;background:linear-gradient(90deg,#4fd8ff,#a7f2ff,#4fd8ff);transform:rotate(9deg);clip-path:polygon(43% 0,68% 0,100% 100%,0 100%);animation:riverFlow 1.8s linear infinite}.scene .cloud{position:absolute;width:100px;height:30px;border-radius:30px;background:rgba(255,255,255,.75);box-shadow:28px -13px 0 8px rgba(255,255,255,.72),56px 0 0 0 rgba(255,255,255,.72);animation:cloudDrift 14s linear infinite}.scene .cloud.c1{top:44px;left:-140px}.scene .cloud.c2{top:105px;left:-210px;animation-duration:20s;transform:scale(.7)}.scene .airship{position:absolute;top:72px;left:10%;font-size:70px;filter:drop-shadow(0 8px 4px rgba(0,0,0,.24));animation:airship 9s ease-in-out infinite}.scene .dragon-fly{position:absolute;top:135px;right:12%;font-size:54px;animation:dragonFly 6s ease-in-out infinite;filter:drop-shadow(0 8px 4px rgba(0,0,0,.25))}.scene .runner{position:absolute;bottom:25px;left:9%;font-size:56px;animation:runner 6s linear infinite;z-index:6}.scene .portal-ring{position:absolute;right:9%;bottom:42px;width:90px;height:115px;border-radius:50%;border:11px solid #8e74ff;box-shadow:0 0 16px #b59fff,inset 0 0 19px #b59fff;animation:portal 2.4s linear infinite}.scene .portal-ring:after{content:"";position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle,#fff 0,#65f4ff 25%,#7d44d8 58%,transparent 60%);animation:portalInner 1.2s ease-in-out infinite}.scene .rocket-mini{position:absolute;bottom:32px;left:58%;font-size:48px;animation:rocketHover 2s ease-in-out infinite;z-index:5}.scene .particles i{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;animation:particle 3s linear infinite}.scene .particles i:nth-child(1){left:20%;top:20%;animation-delay:.1s}.scene .particles i:nth-child(2){left:42%;top:12%;animation-delay:.7s}.scene .particles i:nth-child(3){left:76%;top:28%;animation-delay:1.2s}.scene .particles i:nth-child(4){left:30%;top:58%;animation-delay:1.8s}.scene .particles i:nth-child(5){left:86%;top:61%;animation-delay:2.4s}.scene-caption{position:absolute;left:14px;right:14px;bottom:12px;z-index:12;display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(6,20,46,.78);backdrop-filter:blur(8px);font-weight:900}@keyframes sunPulse{50%{transform:scale(1.08);box-shadow:0 0 58px #ffe75d}}@keyframes riverFlow{50%{filter:brightness(1.18)}}@keyframes cloudDrift{to{transform:translateX(calc(100vw + 350px))}}@keyframes airship{50%{transform:translate(95px,12px) rotate(2deg)}}@keyframes dragonFly{0%,100%{transform:translate(0,0) rotate(-3deg)}50%{transform:translate(-90px,-38px) rotate(5deg)}}@keyframes runner{0%{transform:translateX(-120px) scaleX(1)}48%{transform:translateX(420px) scaleX(1)}50%{transform:translateX(420px) scaleX(-1)}98%{transform:translateX(-120px) scaleX(-1)}100%{transform:translateX(-120px) scaleX(1)}}@keyframes portal{to{filter:hue-rotate(360deg)}}@keyframes portalInner{50%{transform:scale(.82);opacity:.65}}@keyframes rocketHover{50%{transform:translateY(-22px) rotate(5deg)}}@keyframes particle{0%{opacity:0;transform:translateY(20px) scale(.3)}50%{opacity:1}100%{opacity:0;transform:translateY(-40px) scale(1.4)}}

/* Missions and curriculum */
.mission-list,.topic-list,.result-list{display:grid;gap:10px}.mission{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:18px;background:rgba(255,255,255,.065)}.mission-icon{width:50px;height:50px;display:grid;place-items:center;border-radius:16px;background:rgba(255,255,255,.1);font-size:24px}.mission small{color:var(--muted)}.subject-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.subject-card{position:relative;overflow:hidden;min-height:150px}.subject-card:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;right:-30px;bottom:-42px;background:var(--subjectGlow,rgba(101,244,255,.16))}.subject-card strong{font-size:18px}.subject-card p{color:var(--muted);font-size:14px}.topic-chip{display:inline-block;margin:4px 4px 0 0;padding:6px 9px;border-radius:99px;background:rgba(255,255,255,.08);font-size:12px}.ability-row{display:grid;grid-template-columns:170px 1fr 56px;gap:10px;align-items:center}.ability-row strong:last-child{text-align:right;color:var(--gold)}

/* Exercises */
.exercise-shell{width:min(900px,calc(100% - 24px));margin:0 auto;padding:18px 0 70px}.exercise-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.exercise-head .progress{flex:1}.story-box{background:#fffdf4;color:#1d2940;border-radius:20px;padding:clamp(20px,4vw,34px);font-family:Georgia,"Times New Roman",serif;font-size:clamp(19px,2.8vw,23px);line-height:1.72;max-height:55vh;overflow:auto}.answer-grid{display:grid;gap:10px;margin:18px 0}.answer{padding:15px 17px;border:2px solid transparent;border-radius:16px;background:rgba(255,255,255,.08);font-weight:850;text-align:left}.answer.has-guide{display:grid;grid-template-columns:minmax(102px,130px) 1fr;align-items:center;gap:13px}.answer-guide{display:flex;align-items:center;gap:9px;min-width:0}.answer-letter{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(145deg,var(--cyan),var(--violet));color:#07152f;font-weight:1000;font-size:18px;box-shadow:0 7px 16px rgba(101,244,255,.18)}.answer-stars{display:flex;gap:2px;color:var(--gold);font-size:18px;letter-spacing:-2px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}.answer-stars i{font-style:normal}.answer-copy{min-width:0}.star-legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 2px;padding:10px 12px;border-radius:14px;background:rgba(255,207,74,.1);border:1px solid rgba(255,207,74,.24);font-size:14px}.star-legend strong{margin-right:3px}.star-legend span{padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--gold);font-weight:900}.answer:hover{border-color:rgba(101,244,255,.4)}.answer.selected{border-color:var(--gold);background:rgba(255,207,74,.13)}.answer.correct{border-color:var(--mint);background:rgba(104,240,184,.13)}.answer.wrong{border-color:var(--danger);background:rgba(255,111,125,.12)}.input{width:100%;padding:14px 15px;border-radius:15px;border:1px solid var(--line);background:#0a214c;color:#fff;font-size:18px}.feedback{padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.08);margin:14px 0}.feedback.good{border:1px solid rgba(104,240,184,.45);background:rgba(104,240,184,.12)}.feedback.try{border:1px solid rgba(255,207,74,.4);background:rgba(255,207,74,.1)}.read-toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.focus-callout{display:flex;gap:11px;align-items:center;padding:12px 14px;border-radius:16px;background:rgba(101,244,255,.1);border:1px solid rgba(101,244,255,.24);margin-bottom:14px}.focus-callout small{display:block;color:var(--muted)}

/* Games */
.game-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.game-card{padding:20px;text-align:left;border-radius:22px;background:linear-gradient(145deg,rgba(24,58,122,.95),rgba(10,29,66,.96));border:1px solid var(--line);box-shadow:var(--shadow);transition:.2s}.game-card:hover{transform:translateY(-5px)}.game-card .game-art{height:130px;border-radius:17px;display:grid;place-items:center;font-size:72px;background:radial-gradient(circle,rgba(101,244,255,.3),transparent 60%),rgba(255,255,255,.06);margin-bottom:14px}.game-area{max-width:900px;margin:0 auto}.connect-board{width:min(600px,100%);margin:18px auto;display:grid;grid-template-columns:repeat(7,1fr);gap:7px;padding:12px;border-radius:22px;background:linear-gradient(#2683ff,#1256c7);box-shadow:inset 0 0 0 4px rgba(255,255,255,.12),var(--shadow)}.connect-cell{aspect-ratio:1;border-radius:50%;background:#07152f;box-shadow:inset 0 5px 10px rgba(0,0,0,.4);position:relative}.connect-cell.red:after,.connect-cell.yellow:after{content:"";position:absolute;inset:7%;border-radius:50%;animation:discDrop .38s cubic-bezier(.2,.9,.3,1.2)}.connect-cell.red:after{background:radial-gradient(circle at 35% 30%,#ffb0b7,#ff4254 55%,#a50d22)}.connect-cell.yellow:after{background:radial-gradient(circle at 35% 30%,#fff5a7,#ffd52f 55%,#c48600)}@keyframes discDrop{from{transform:translateY(-390px) rotate(180deg)}to{transform:translateY(0)}}.reaction-stage{display:grid;gap:14px}.reaction-light{height:180px;border-radius:25px;display:grid;place-items:center;text-align:center;background:#c33b45;font-size:clamp(26px,5vw,48px);font-weight:950;box-shadow:inset 0 -20px 60px rgba(0,0,0,.2)}.reaction-light.wait{background:#bd8c22}.reaction-light.go{background:#27b85e;animation:goPulse .7s ease-in-out infinite}.reaction-pads{display:grid;grid-template-columns:1fr 1fr;gap:12px}.reaction-pad{min-height:120px;border-radius:22px;background:rgba(255,255,255,.1);font-size:24px;font-weight:950}.reaction-pad.done{background:rgba(104,240,184,.18); const fmtTime = sec => `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;

  const profiles = deepClone(DATA.DEFAULT_PROFILES).map(p=>normaliseProfile(p));
  return {version:VERSION,migrationGrantV2:true,currentProfileId:null,view:'home',profiles,logs:[],parent:{pin:'2580',email:'J_van_geelen@hotmail.com'},createdAt:new Date().toISOString()};
}

function normaliseProfile(p){
  const level = levelById(p.levelId) || DATA.LEVELS[0];
  const curriculum = curriculumForLevel(level);
  const abilities = {...(p.abilities||{})};
  curriculum.forEach(([subject])=>{if(abilities[subject] == null) abilities[subject]=level.scale;});
  return {
    id:p.id||uid(),name:p.name||'Nieuwe held',gender:p.gender||'neutral',age:Number(p.age)||6,levelId:level.id,
    points:Number(p.points ?? 1000),xp:Number(p.xp||0),interests:Array.isArray(p.interests)?p.interests:[],family:p.family||'',storyContext:p.storyContext||'',

  };
}

function loadState(){
  try{
    const current = JSON.parse(localStorage.getItem(KEY));

      current.profiles=current.profiles.map(normaliseProfile);

      if(!current.migrationGrantV2){
        current.profiles.forEach(p=>p.points=(p.points||0)+1000);
        current.migrationGrantV2=true;
      }
      current.version=VERSION;
      localStorage.setItem(KEY,JSON.stringify(current));
      return current;
    }
  }catch(e){console.warn('V2 state kon niet worden gelezen',e);}
  const fresh=createInitialState();
  try{
    const old=JSON.parse(localStorage.getItem(OLD_KEY));
    if(old?.profiles){
      for(const id of ['dani','zana']){
        const oldP=old.profiles[id], newP=fresh.profiles.find(p=>p.id===id);
        if(oldP&&newP){
          newP.points=1000+Number(oldP.coins||0);
          newP.xp=Number(oldP.xp||0);
          newP.sessions=(oldP.sessions||[]).map(s=>({...s,id:uid()}));
          Object.entries(oldP.skills||{}).forEach(([subject,skill])=>{if(newP.abilities[subject]!=null)newP.abilities[subject]=clamp(Math.round((skill.rating||2.5)*20),5,130);});
        }
      }
      fresh.migratedFromV1=true;
    }

function curriculumForLevel(level){
  if(!level) return DATA.CURRICULUM.early;
  if(level.sector==='po'){
    if(level.year<=2)return DATA.CURRICULUM.early;
    if(level.year<=4)return DATA.CURRICULUM.po34;
    if(level.year<=6)return DATA.CURRICULUM.po56;
    return DATA.CURRICULUM.po78;
  }
  const base=deepClone(DATA.CURRICULUM.voCore);
  if(['vmbo-basis','vmbo-kader'].includes(level.track)) return base.filter(([s])=>!['chemistry','physics','latin','greek'].includes(s));
  if(level.track==='mavo') return base.filter(([s])=>!['latin','greek'].includes(s));
  if(level.track==='gymnasium') return [...base,['latin',['woordenschat','grammatica','vertalen','Romeinse cultuur']],['greek',['alfabet','grammatica','vertalen','Griekse cultuur']]];
  return base;
}
function availableSubjects(p=current()){return curriculumForLevel(levelById(p.levelId)).map(([s])=>s);}
function subjectTopics(subject,p=current()){
  return curriculumForLevel(levelById(p.levelId)).find(([s])=>s===subject)?.[1]||['basisvaardigheden','toepassen','controleren'];
}

function ensureDaily(){
  const p=current();if(!p)return;
  if(p.daily.date===todayKey()&&p.daily.plan?.length)return;
  const subjects=availableSubjects(p);
  let plan;
  if(p.id==='dani'&&subjects.includes('reading')&&subjects.includes('spelling')&&subjects.includes('math')) plan=['reading','spelling','reading','math','spelling'];
  else if(p.id==='zana') plan=['reading','math','dutch','reading','english','study'].filter(s=>subjects.includes(s));
  else if(p.id==='lena') plan=['reading','math','creative','reading'].filter(s=>subjects.includes(s));
  else plan=shuffle(subjects).slice(0,Math.min(subjects.length,currentLevel().sector==='po'?5:6));
  p.daily={date:todayKey(),done:[],plan};save();
}

function makeReading(ability,p){

function makeMath(a){
  let x,y,answer,prompt,explain;
  if(a<20){x=2+rand(8);y=1+rand(7);answer=x+y;prompt=`Hoeveel is ${x} plus ${y}?`;explain='Tel verder vanaf het grootste getal.';}
  else if(a<35){x=10+rand(70);y=2+rand(25);answer=x-y;prompt=`${x} min ${y} is`;explain='Splits het tweede getal in tientallen en eenheden.';}
  else if(a<50){x=2+rand(8);y=2+rand(10);answer=x*y;prompt=`${x} keer ${y} is`;explain=`Gebruik de tafel van ${x}.`;}
  else if(a<65){x=120+rand(780);y=20+rand(280);answer=x-y;prompt=`Bereken ${x} min ${y}.`;explain='Werk in stappen of kolomsgewijs en controleer met optellen.';}
  else if(a<80){const pct=[10,20,25,50][rand(4)];x=[80,120,160,240][rand(4)];answer=x*pct/100;prompt=`Hoeveel is ${pct} procent van ${x}?`;explain='Gebruik een handige breuk of bereken eerst tien procent.';}
  else if(a<95){x=2+rand(9);y=10+rand(25);answer=y-x;prompt=`Los op: x plus ${x} is ${y}. Wat is x?`;explain='Gebruik de omgekeerde bewerking.';}
  else if(a<110){x=2+rand(7);y=2+rand(5);answer=Math.pow(x,y);prompt=`Bereken ${x} tot de macht ${y}.`;explain='Een macht is herhaald vermenigvuldigen.';}
  else if(a<120){x=1+rand(5);y=1+rand(6);answer=2*x*y+x;prompt=`Voor f(x) = ${x}x² + ${x}x geldt: wat is f'(${y})?`;explain=`De afgeleide is ${2*x}x + ${x}. Vul daarna ${y} in.`;}
  else {x=1+rand(4);y=2+rand(5);answer=(Math.log(Math.pow(y,x))/Math.log(y));prompt=`Los op: ${y}^x = ${Math.pow(y,x)}. Wat is x?`;explain='Herken dezelfde basis of gebruik logaritmen.';}
  return {type:'input',prompt,answer:String(answer).replace('.',','),explain};
}
function makeLanguage(a){

  ];const c=pool.filter(q=>q.min<=a+8);const q=deepClone(c[c.length-1]||pool[0]);q.type='choice';q.options=shuffle(q.options);return q;
}
function makeKnowledge(subject,a){

  const showStars=hasFourAnswerStarGuide(q);
  const starLegend=showStars?`<div class="star-legend"><strong>Kies met letters of sterren:</strong><span>A = ★</span><span>B = ★★</span><span>C = ★★★</span><span>D = ★★★★</span></div>`:'';
  return `<h2>${esc(q.prompt)}</h2><div class="row"><button class="btn small" onclick="speakQuestion()"><span aria-hidden="true">🔊</span> Lees vraag en antwoorden voor</button>${q.spoken?`<button class="btn small" onclick="speakSpellingWord()">Hoor het woord</button>`:''}</div>${q.type==='choice'?`${starLegend}<div class="answer-grid">${q.options.map((o,i)=>`<button class="answer ${showStars?'has-guide':''} ${ex.selected===o?'selected':''} ${ex.answered&&o===q.answer?'correct':''} ${ex.answered&&ex.selected===o&&o!==q.answer?'wrong':''}" onclick='chooseAnswer(${JSON.stringify(o)})' ${ex.answered?'disabled':''}>${showStars?answerMarkerHTML(i):''}<span class="answer-copy">${esc(o)}</span></button>`).join('')}</div>`:`<input id="answerInput" class="input" autocomplete="off" value="${esc(ex.selected||'')}" placeholder="Typ je antwoord" oninput="runtime.exercise.selected=this.value">`}${ex.answered?`<div class="feedback ${ex.wasCorrect?'good':'try'}"><strong>${ex.wasCorrect?'Goed onderzocht.':'Dit is je leermoment.'}</strong><br>${esc(q.explain)}${!ex.wasCorrect?` Het juiste antwoord is ${esc(q.answer)}.`:''}</div>`:''}<div class="row between" style="margin-top:16px"><span class="muted">${ex.answered?'Bekijk waarom het antwoord klopt.':'Controleer je antwoord voordat je doorgaat.'}</span>${ex.answered?`<button class="btn primary" onclick="nextExerciseStep()">${isReading&&ex.readingIndex<qParentQuestions().length-1?'Volgende vraag':(!isReading&&ex.index<ex.questions.length-1?'Volgende opdracht':'Missie afronden')}</button>`:`<button class="btn cyan" onclick="checkAnswer()">Controleer</button>`}</div>`;}
function qParentQuestions(){return runtime.exercise.questions[0].questions;}
window.confirmStoryRead=()=>{runtime.exercise.storyRead=true;runtime.exercise.readingIndex=0;runtime.exercise.answered=false;runtime.exercise.selected=null;render();};
window.speakStory=()=>speakText(runtime.exercise.questions[0].story);
window.speakQuestion=()=>{const ex=runtime.exercise;let q=ex.subject==='reading'?ex.questions[0].questions[ex.readingIndex||0]:ex.questions[ex.index];const stars=hasFourAnswerStarGuide(q);speakText(`${q.prompt}. ${q.options?q.options.map((o,i)=>`${spokenAnswerMarker(i,stars)}: ${o}`).join('. '):''}`);};
window.speakSpellingWord=()=>{const q=runtime.exercise.questions[runtime.exercise.index];speakText(q.spoken||q.answer);};
window.stopSpeaking=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();};
function stripForSpeech(text){return String(text||'').replace(/[\p{Extended_Pictographic}\p{Emoji_Presentation}\u200d\ufe0f]/gu,' ').replace(/[_*#`~<>\[\]{}|\\/=+]/g,' ').replace(/\s+/g,' ').trim();}
function speakText(text){const p=current();if(!p.settings.sound||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(stripForSpeech(text));u.lang='nl-NL';u.rate=p.age<=6?.84:.96;window.speechSynthesis.speak(u);}
window.chooseAnswer=value=>{if(runtime.exercise.answered)return;runtime.exercise.selected=value;render();};
window.checkAnswer=()=>{
  const ex=runtime.exercise;let q=ex.subject==='reading'?ex.questions[0].questions[ex.readingIndex||0]:ex.questions[ex.index];
  if(q.type!=='choice'){const input=$('#answerInput');ex.selected=(input?.value??ex.selected??'').trim();}
  if(!String(ex.selected??'').trim())return toast('Vul of kies eerst een antwoord.');
  const norm=s=>String(s).toLowerCase().trim().replace(/\s+/g,' ').replace('.',',');ex.wasCorrect=norm(ex.selected)===norm(q.answer);ex.answered=true;if(ex.wasCorrect){ex.correct++;ex.streak++;}else ex.streak=0;render();
};
window.nextExerciseStep=()=>{
  const ex=runtime.exercise;
  if(ex.subject==='reading'){
    const qs=ex.questions[0].questions;if((ex.readingIndex||0)<qs.length-1){ex.readingIndex++;ex.answered=false;ex.selected=null;render();}else finishExercise(qs.length);
  }else if(ex.index<ex.questions.length-1){ex.index++;ex.answered=false;ex.selected=null;ex.wasCorrect=false;render();}else finishExercise(ex.questions.length);
};
window.leaveExercise=()=>{if(confirm('Oefening verlaten? De onvoltooide opdracht wordt niet opgeslagen.')){runtime.exercise=null;render();}};
function finishExercise(total){
  const ex=runtime.exercise,p=current(),score=Math.round(ex.correct/Math.max(1,total)*100),old=p.abilities[ex.subject]??levelScale(p),diagnostic=p.diagnosticRemaining>0;
  const delta=score>=90?(diagnostic?7:3):score>=70?(diagnostic?3:1):score>=45?(diagnostic?-2:-1):(diagnostic?-7:-4);
  p.abilities[ex.subject]=clamp(old+delta,5,132);if(diagnostic)p.diagnosticRemaining--;
  const points=50+ex.correct*18+Math.max(0,ex.streak-1)*8;p.points+=points;p.xp+=points;
  if(ex.dailyIndex!=null&&!p.daily.done.includes(ex.dailyIndex))p.daily.done.push(ex.dailyIndex);
  const session={id:uid(),date:new Date().toISOString(),subject:ex.subject,topic:ex.topic,score,points,seconds:Math.round((Date.now()-ex.startedAt)/1000),abilityBefore:old,abilityAfter:p.abilities[ex.subject]};p.sessions.unshift(session);p.sessions=p.sessions.slice(0,400);state.logs.unshift({...session,profileId:p.id,profileName:p.name});state.logs=state.logs.slice(0,800);save();runtime.exercise=null;reward(points,score,delta);}
function reward(points,score,delta){const overlay=document.createElement('div');overlay.className='celebration';overlay.innerHTML=`<div class="card reward"><div class="reward-icon">${score===100?'🏆':'⚡'}</div><span class="eyebrow">Missie voltooid</span><h1>${score===100?'Perfecte combo.':'Sterke vooruitgang.'}</h1><p class="muted">${score}% goed · +${points} punten · niveau ${delta>=0?'+':''}${delta}</p><button class="btn primary" id="rewardContinue">Verder bouwen</button></div>`;document.body.appendChild(overlay);confetti();$('#rewardContinue').onclick=()=>{overlay.remove();render();};}
function confetti(){for(let i=0;i<45;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=`hsl(${Math.random()*360} 90% 65%)`;c.style.animationDelay=Math.random()*.5+'s';c.style.animationDuration=1.3+Math.random()*1.2+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2800);}}

function renderGames(){const content=`<div class="section-head" style="margin-top:0"><div><span class="eyebrow">Arcade met leerbeloningen</span><h1>Spelzone</h1></div><p>Spellen leveren een kleine puntenbonus op, maar huiswerk blijft de snelste bouwroute.</p></div><div class="game-grid"><button class="game-card" onclick="openGame('connect4')"><div class="game-art" aria-hidden="true">🔴</div><h2>Vier op een rij</h2><p class="muted">Druk rechtstreeks op een vak in de gewenste kolom. Geen pijlen boven het bord.</p></button><button class="game-card" onclick="openGame('reaction')"><div class="game-art" aria-hidden="true">⚡</div><h2>Reactieduel</h2><p class="muted">Het groene signaal start een nauwkeurige timer. De winnaar en beide tijden worden duidelijk getoond.</p></button><button class="game-card" onclick="openGame('memory')"><div class="game-art" aria-hidden="true">🧩</div><h2>Memory Lab</h2><p class="muted">Kies een veld van 4 bij 4, 6 bij 4 of een grote 6 bij 6 uitdaging.</p></button></div>`;$('#app').innerHTML=shell(content,'games');}
window.openGame=type=>{runtime.game={type};if(type==='connect4')initConnect4();if(type==='reaction')initReaction();if(type==='memory')initMemory(16);render();};
function renderGame(){if(runtime.game.type==='connect4')return renderConnect4();if(runtime.game.type==='reaction')return renderReaction();return renderMemory();}
function gameShell(inner){$('#app').innerHTML=`<div class="app"><header class="topbar"><div class="brand"><span class="brand-mark">🎮</span><span>Spelzone</span></div><button class="btn" onclick="closeGame()">Terug</button></header><main class="container game-area">${inner}</main></div>`;}
window.closeGame=()=>{clearTimeout(runtime.reactionTimer);runtime.game=null;render();};
function initConnect4(){runtime.game={type:'connect4',board:Array.from({length:6},()=>Array(7).fill(0)),player:1,winner:0,moves:0};}
function renderConnect4(){const g=runtime.game;gameShell(`<div class="section-head" style="margin-top:0"><div><span class="eyebrow">Direct veld indrukken</span><h1>Vier op een rij</h1></div><button class="btn" onclick="resetConnect4()">Nieuw spel</button></div><section class="card"><h2>${g.winner?`${g.winner===1?'Rood':'Geel'} wint in ${g.moves} zetten.`:`${g.player===1?'Rood':'Geel'} is aan de beurt.`}</h2><p class="muted">Druk op ieder leeg vak in de kolom waar je de schijf wilt laten vallen.</p><div class="connect-board">${g.board.flatMap((row,r)=>row.map((v,c)=>`<button class="connect-cell ${v===1?'red':v===2?'yellow':''}" onclick="connectMove(${c})" aria-label="Kolom ${c+1}, rij ${r+1}"></button>`)).join('')}</div></section>`);}
window.resetConnect4=()=>{initConnect4();render();};
window.connectMove=col=>{const g=runtime.game;if(g.winner)return;let row=-1;for(let r=5;r>=0;r--)if(g.board[r][col]===0){row=r;break;}if(row<0)return toast('Deze kolom is vol.');g.board[row][col]=g.player;g.moves++;if(connectWinner(g.board,g.player)){g.winner=g.player;current().points+=30;save();}else g.player=g.player===1?2:1;render();};
function connectWinner(b,p){for(let r=0;r<6;r++)for(let c=0;c<7;c++){if([[0,1],[1,0],[1,1],[1,-1]].some(([dr,dc])=>[0,1,2,3].every(i=>b[r+dr*i]?.[c+dc*i]===p)))return true;}return false;}
function initReaction(){runtime.game={type:'reaction',phase:'ready',mode:2,times:[null,null],falseStart:null,message:'Kies starten. Wacht daarna tot het veld groen wordt.'};}
function renderReaction(){const g=runtime.game;const winner=g.times.every(x=>x!=null)?(g.times[0]===g.times[1]?'Gelijkspel':g.times[0]<g.times[1]?'Speler 1 is het snelst':'Speler 2 is het snelst'):'';gameShell(`<div class="section-head" style="margin-top:0"><div><span class="eyebrow">Timer in milliseconden</span><h1>Reactieduel</h1></div><button class="btn" onclick="initReaction();render()">Reset</button></div><section class="card reaction-stage"><div class="row"><label>Spelers<select class="input" onchange="setReactionMode(this.value)"><option value="1" ${g.mode===1?'selected':''}>1 speler</option><option value="2" ${g.mode===2?'selected':''}>2 spelers</option></select></label><button class="btn primary" onclick="startReaction()" ${g.phase==='waiting'||g.phase==='go'?'disabled':''}>Start ronde</button></div><div class="reaction-light ${g.phase==='waiting'?'wait':g.phase==='go'?'go':''}">${g.phase==='ready'?'Klaar?':g.phase==='waiting'?'Wacht op groen':g.phase==='go'?'NU DRUKKEN':'Ronde klaar'}</div><div class="reaction-pads"><button class="reaction-pad ${g.times[0]!=null?'done':''}" onclick="reactionTap(0)">Speler 1<br><strong>${g.times[0]!=null?g.times[0]+' ms':'druk hier'}</strong></button>${g.mode===2?`<button class="reaction-pad ${g.times[1]!=null?'done':''}" onclick="reactionTap(1)">Speler 2<br><strong>${g.times[1]!=null?g.times[1]+' ms':'druk hier'}</strong></button>`:''}</div><div class="feedback ${winner?'good':''}"><strong>${winner||g.message}</strong>${winner?`<br>${g.times[0]} ms tegenover ${g.times[1]} ms. Verschil: ${Math.abs(g.times[0]-g.times[1])} ms.`:''}</div></section>`);}
window.setReactionMode=v=>{initReaction();runtime.game.mode=Number(v);render();};
window.startReaction=()=>{const g=runtime.game;g.phase='waiting';g.times=[null,null];g.message='Niet te vroeg drukken.';render();clearTimeout(runtime.reactionTimer);runtime.reactionTimer=setTimeout(()=>{g.phase='go';runtime.reactionStartedAt=performance.now();g.message='De timer loopt nu.';render();},1400+Math.random()*2600);};
window.reactionTap=player=>{const g=runtime.game;if(player===1&&g.mode===1)return;if(g.phase==='waiting'){clearTimeout(runtime.reactionTimer);g.phase='done';g.message=`Speler ${player+1} drukte te vroeg. Nieuwe ronde nodig.`;render();return;}if(g.phase!=='go'||g.times[player]!=null)return;g.times[player]=Math.round(performance.now()-runtime.reactionStartedAt);if(g.mode===1||g.times.every(x=>x!=null)){g.phase='done';const best=g.mode===1?g.times[0]:Math.min(...g.times);current().points+=best<250?25:10;save();}render();};
function initMemory(size){const symbols=['⚽','🏑','🚀','🐉','🏰','🦖','🏎️','🛸','🦈','🎓','💎','🤖','🌋','🎡','🌺','⚡','🧠','📚'];const pairs=size/2;const deck=shuffle([...symbols.slice(0,pairs),...symbols.slice(0,pairs)]).map((symbol,i)=>({id:i,symbol,open:false,matched:false}));runtime.game={type:'memory',size,cols:size===16?4:6,deck,open:[],moves:0,locked:false,finished:false};}
function renderMemory(){const g=runtime.game;gameShell(`<div class="section-head" style="margin-top:0"><div><span class="eyebrow">Kies de veldgrootte</span><h1>Memory Lab</h1></div><div class="row"><button class="btn small" onclick="initMemory(16);render()">4 × 4</button><button class="btn small" onclick="initMemory(24);render()">6 × 4</button><button class="btn small" onclick="initMemory(36);render()">6 × 6</button></div></div><section class="card"><div class="row between"><h2>${g.finished?`Klaar in ${g.moves} beurten.`:`${g.moves} beurten`}</h2><button class="btn" onclick="initMemory(${g.size});render()">Opnieuw</button></div><div class="memory-board" style="--cols:${g.cols}">${g.deck.map(c=>`<button class="memory-card ${c.open?'open':''} ${c.matched?'matched':''}" data-symbol="${c.symbol}" onclick="memoryFlip(${c.id})" aria-label="Memorykaart"></button>`).join('')}</div></section>`);}
window.memoryFlip=id=>{const g=runtime.game,c=g.deck.find(x=>x.id===id);if(g.locked||c.open||c.matched)return;c.open=true;g.open.push(c);if(g.open.length===2){g.moves++;if(g.open[0].symbol===g.open[1].symbol){g.open.forEach(x=>x.matched=true);g.open=[];if(g.deck.every(x=>x.matched)){g.finished=true;current().points+=g.size===36?50:g.size===24?30:20;save();}render();}else{g.locked=true;render();setTimeout(()=>{g.open.forEach(x=>x.open=false);g.open=[];g.locked=false;render();},750);}}else render();};

function renderMarket(){const p=current(),cats=['alles',...new Set(DATA.MARKET_ITEMS.map(i=>i.category))];const items=DATA.MARKET_ITEMS.filter(i=>runtime.marketFilter==='alles'||i.category===runtime.marketFilter);const content=`<div class="section-head" style="margin-top:0"><div><span class="eyebrow">Grotere, levende objecten</span><h1>Nexus-marktplaats</h1></div><div class="pill">${p.points} punten</div></div><div class="market-toolbar">${cats.map(c=>`<button class="btn small ${runtime.marketFilter===c?'cyan':''}" onclick="setMarketFilter('${c}')">${esc(c)}</button>`).join('')}</div><div class="market-grid" style="margin-top:15px">${items.map(marketCard).join('')}</div>`;$('#app').innerHTML=shell(content,'market');}

function renderWorld(){const p=current();const content=`<div class="section-head" style="margin-top:0"><div><span class="eyebrow">Diepte-editor</span><h1>${esc(p.name)}’s levende wereld</h1></div><p>Plaats objecten achter, tussen of voor elkaar.</p></div><div class="world-editor"><div class="card world-canvas-wrap"><div class="world-canvas" id="worldCanvas"><div class="world-ambient" aria-hidden="true">${Array.from({length:10},(_,i)=>`<i style="--i:${i}"></i>`).join('')}</div>${Array.from({length:96},(_,i)=>`<button class="world-cell" onclick="worldCell(${i%12},${Math.floor(i/12)})" aria-label="Wereldveld"></button>`).join('')}${p.placements.map(placementHTML).join('')}</div></div><aside class="card"><span class="eyebrow">Inventaris</span><h2>Plaats en animeer</h2><p class="muted">Kies een object, kies de dieptelaag en tik daarna op een veld. Een geselecteerd object kan worden verplaatst of verwijderd.</p><label>Dieptelaag<select class="input" onchange="runtime.selectedDepth=Number(this.value)"><option value="1" ${runtime.selectedDepth===1?'selected':''}>Achtergrond</option><option value="2" ${runtime.selectedDepth===2?'selected':''}>Midden</option><option value="3" ${runtime.selectedDepth===3?'selected':''}>Voorgrond</option></select></label><div class="inventory-list" style="margin-top:12px">${p.inventory.map(id=>{const it=DATA.MARKET_ITEMS.find(x=>x.id===id);return it?`<button class="inventory-item ${runtime.selectedInventory===id?'active':''}" onclick="selectInventory('${id}')"><div style="font-size:33px">${ITEM_SYMBOL[it.kind]}</div><small>${esc(it.name)}</small></button>`:'';}).join('')}</div><div class="row" style="margin-top:14px"><button class="btn small" onclick="cancelPlacement()">Annuleer</button><button class="btn danger small" onclick="removePlacement()" ${runtime.editingPlacement?'':'disabled'}>Verwijder</button></div></aside></div>`;$('#app').innerHTML=shell(content,'world');}

function renderParent(){const p=current();const content=`<div class="section-head" style="margin-top:0"><div><span class="eyebrow">Ouderomgeving</span><h1>Voortgang en beheer</h1></div><div class="row"><button class="btn" onclick="exportData()">Back-up</button><button class="btn" onclick="emailReport()">E-mailrapport</button></div></div><div class="grid3">${state.profiles.map(parentProfileCard).join('')}</div><section class="card" style="margin-top:18px"><span class="eyebrow">Recente resultaten</span><h2>Alle kinderen</h2>${resultsTable(state.logs.slice(0,40))}</section><div class="grid2" style="margin-top:18px"><section class="card"><span class="eyebrow">Profielen</span><h2>Nieuwe leerling toevoegen</h2><p class="muted">Het profiel start op het gekozen schoolniveau en verfijnt dat met zes diagnostische missies.</p><button class="btn cyan" onclick="openProfileCreator()">Nieuw profiel</button></section><section class="card"><span class="eyebrow">Instellingen</span><h2>Rapportage</h2><label>E-mailadres<input id="parentEmail" class="input" type="email" value="${esc(state.parent.email)}"></label><label style="margin-top:10px">Oudercode<input id="parentPin" class="input" inputmode="numeric" value="${esc(state.parent.pin)}"></label><button class="btn primary" style="margin-top:12px" onclick="saveParent()">Opslaan</button></section></div><section class="notice" style="margin-top:18px"><strong>V2-compensatie:</strong> ieder bestaand en standaard kinderprofiel heeft eenmalig 1.000 punten ontvangen, zodat eerdere marktplaatsvoortgang kan worden vervangen.</section>`;$('#app').innerHTML=shell(content,'parent');}
function parentProfileCard(p){return `<article class="card"><span class="eyebrow">${esc(profileLevelLabel(p))}</span><h2>${esc(p.name)}</h2><div class="grid3"><div class="stat"><strong>${p.sessions.length}</strong><small>missies</small></div><div class="stat"><strong>${averageScore(p)}%</strong><small>gemiddeld</small></div><div class="stat"><strong>${p.points}</strong><small>punten</small></div></div><div class="result-list" style="margin-top:14px">${availableSubjects(p).slice(0,5).map(s=>{const v=p.abilities[s]??levelScale(p);return `<div class="ability-row"><span>${esc(subjectMeta(s).label)}</span><div class="progress"><span style="--w:${v/130*100}%"></span></div><strong>${Math.round(v)}</strong></div>`;}).join('')}</div></article>`;}
function resultsTable(logs){if(!logs.length)return'<p class="muted">Nog geen resultaten.</p>';return `<div class="table-wrap"><table><thead><tr><th>Datum</th><th>Kind</th><th>Vak</th><th>Score</th><th>Niveau</th><th>Tijd</th></tr></thead><tbody>${logs.map(l=>`<tr><td>${formatDate(l.date)}</td><td>${esc(l.profileName)}</td><td>${esc(subjectMeta(l.subject).label)}</td><td>${l.score}%</td><td>${l.abilityBefore} → ${l.abilityAfter}</td><td>${fmtTime(l.seconds)}</td></tr>`).join('')}</tbody></table></div>`;}
window.openParent=()=>{const pin=prompt('Voer de oudercode in:');if(pin===state.parent.pin){state.view='parent';render();}else if(pin!=null)toast('De oudercode klopt niet.');};
window.openParentFromProfiles=()=>{const pin=prompt('Voer de oudercode in:');if(pin===state.parent.pin){state.currentProfileId=state.profiles[0]?.id;state.view='parent';render();}else if(pin!=null)alert('De oudercode klopt niet.');};
window.saveParent=()=>{state.parent.email=$('#parentEmail').value.trim()||state.parent.email;state.parent.pin=$('#parentPin').value.trim()||state.parent.pin;save();toast('Instellingen opgeslagen.');};
window.exportData=()=>download(`leerhelden-nexus-backup-${todayKey()}.json`,JSON.stringify(state,null,2),'application/json');
window.emailReport=()=>{const lines=['LEERHELDEN NEXUS RAPPORT',`Datum: ${new Date().toLocaleString('nl-NL')}`,''];state.profiles.forEach(p=>{lines.push(`${p.name} — ${profileLevelLabel(p)}`,`Missies: ${p.sessions.length}; gemiddeld: ${averageScore(p)}%; punten: ${p.points}`);availableSubjects(p).forEach(s=>lines.push(`- ${subjectMeta(s).label}: ${Math.round(p.abilities[s]??levelScale(p))}`));lines.push('');});location.href=`mailto:${encodeURIComponent(state.parent.email)}?subject=${encodeURIComponent('LeerHelden Nexus rapport')}&body=${encodeURIComponent(lines.join('\n'))}`;};
function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}

function openProfileCreator(){
  const levels=DATA.LEVELS.map(l=>`<option value="${l.id}">${esc(l.label)}</option>`).join('');const modal=document.createElement('div');modal.className='modal';modal.id='profileModal';modal.innerHTML=`<section class="card modal-card"><div class="row between"><div><span class="eyebrow">Persoonlijke onboarding</span><h2>Nieuwe leerheld</h2></div><button class="icon-btn" onclick="closeModal()">×</button></div><div class="form-grid"><label>Naam<input id="newName" class="input" placeholder="Voornaam"></label><label>Leeftijd<input id="newAge" class="input" type="number" min="4" max="19" value="8"></label><label>Profiel<select id="newGender" class="input"><option value="male">Jongen</option><option value="female">Meisje</option><option value="neutral">Neutraal</option></select></label><label>Schoolniveau<select id="newLevel" class="input">${levels}</select></label><label style="grid-column:1/-1">Interesses<input id="newInterests" class="input" placeholder="bijvoorbeeld voetbal, paarden, gamen, ruimtevaart"></label><label style="grid-column:1/-1">Belangrijke mensen en thuissituatie<input id="newFamily" class="input" placeholder="namen van gezin, vrienden of huisdieren die in verhalen mogen voorkomen"></label><label style="grid-column:1/-1">Persoonlijke achtergrond voor verhalen<textarea id="newContext" class="input" placeholder="dromen, sterke kanten, hobby’s, dingen die gevoelig liggen of juist motiveren"></textarea><small>Deze informatie blijft standaard alleen lokaal op dit apparaat.</small></label><label>Haarkracht<select id="newHair" class="input">${Object.keys(HAIR).map(x=>`<option>${x}</option>`).join('')}</select></label><label>Aura<select id="newAura" class="input">${Object.keys(AURA).map(x=>`<option>${x}</option>`).join('')}</select></label></div><div class="row between" style="margin-top:16px"><span class="muted">Start met 1.000 punten en zes diagnostische missies.</span><button class="btn primary" onclick="createProfile()">Profiel maken</button></div></section>`;document.body.appendChild(modal);}
window.openProfileCreator=openProfileCreator;window.closeModal=()=>$('#profileModal')?.remove();
window.createProfile=()=>{const name=$('#newName').value.trim();if(!name)return toast('Vul een naam in.');const level=levelById($('#newLevel').value),gender=$('#newGender').value,interests=$('#newInterests').value.split(',').map(x=>x.trim()).filter(Boolean);const p=normaliseProfile({id:uid(),name,gender,age:Number($('#newAge').value)||8,levelId:level.id,points:1000,xp:0,interests,family:$('#newFamily').value.trim(),storyContext:$('#newContext').value.trim(),avatar:{hair:$('#newHair').value,outfit:gender==='female'?'pink':'blue',aura:$('#newAura').value},abilities:{},inventory:['garden'],placements:[],sessions:[],diagnosticRemaining:6});state.profiles.push(p);state.currentProfileId=p.id;state.view='home';save();closeModal();render();};
function openAvatarEditor(){const p=current(),modal=document.createElement('div');modal.className='modal';modal.id='avatarModal';modal.innerHTML=`<section class="card modal-card"><div class="row between"><div><span class="eyebrow">Power-avatar</span><h2>Nieuwe heldenlook</h2></div><button class="icon-btn" onclick="closeAvatarModal()">×</button></div><div class="profile-hero" style="height:290px;border-radius:20px">${avatarHTML(p)}</div><div class="form-grid" style="margin-top:14px"><label>Haar<select id="avatarHair" class="input">${Object.keys(HAIR).map(x=>`<option ${p.avatar.hair===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Pak<select id="avatarOutfit" class="input">${Object.keys(OUTFIT).map(x=>`<option ${p.avatar.outfit===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Aura<select id="avatarAura" class="input">${Object.keys(AURA).map(x=>`<option ${p.avatar.aura===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Vorm<select id="avatarGender" class="input"><option value="male" ${p.gender==='male'?'selected':''}>Mannelijk</option><option value="female" ${p.gender==='female'?'selected':''}>Vrouwelijk</option><option value="neutral" ${p.gender==='neutral'?'selected':''}>Neutraal</option></select></label></div><button class="btn primary" style="margin-top:14px" onclick="saveAvatar()">Avatar opslaan</button></section>`;document.body.appendChild(modal);}
window.openAvatarEditor=openAvatarEditor;window.closeAvatarModal=()=>$('#avatarModal')?.remove();window.saveAvatar=()=>{const p=current();p.avatar.hair=$('#avatarHair').value;p.avatar.outfit=$('#avatarOutfit').value;p.avatar.aura=$('#avatarAura').value;p.gender=$('#avatarGender').value;save();closeAvatarModal();render();};

if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(console.warn));
window.addEventListener('error',e=>console.error('LeerHelden fout',e.error||e.message));
render();

  </script>
</body>
